version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/job_board.db
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - ENABLE_SEED_DATA=true
      - DEBUG=false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

